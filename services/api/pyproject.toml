[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "nebula-api"
version = "0.1.0"
description = "Nebula VPN unprivileged control-plane API"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.20.1",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic-settings==2.16.1",
  "psycopg[binary]==3.3.6",
  "PyJWT[crypto]==2.15.1",
  "redis==8.1.0",
  "segno==1.6.6",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn[standard]==0.54.0",
]

[project.scripts]
nebula-api = "nebula_api.cli:main"

# The build backend, so requirements.lock pins it with hashes too.
[dependency-groups]
build = ["hatchling==1.32.4"]

[project.optional-dependencies]
dev = [
  "hypothesis==6.170.12",
  "httpx2==2.16.0",
  "mypy==2.4.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nebula_api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=nebula_api --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
