# VLESS-over-XHTTP+TLS listener for Nebula's Xray. nginx terminates
# TLS on :8445 and reverse-proxies to Xray's own loopback-only VLESS/XHTTP
# inbound -- Xray itself never sees a public socket.
#
# This is a snippet, not a standalone vhost -- see README.md in this
# directory for the exact include point on the real host, the TLS
# certificate substitution this file assumes, and why :8445 was picked.
#
# Values that must match the deploying agent's settings.py exactly:
#   - listen port           -> Settings.xray_public_port      (default 8445)
#   - upstream loopback port -> Settings.xray_local_listen_port (default 8446)
#   - location path          -> Settings.xray_xhttp_path       (default /xhttp)
#   - server_name / SNI       -> Settings.xray_public_host / xray_sni
# If an operator changes any of those in the agent's environment, this file
# must be edited to match -- nothing here reads the agent's config.
#
# Rate limiting: add a `limit_req_zone` to nginx.conf's http{} block (this
# file cannot declare one itself -- that directive is http-context only) and
# reference it from the `location /v1/` block below. See README.md,
# "Rate limiting the control-plane path", for the exact snippet.

server {
    # `listen ... http2` (not the newer standalone `http2 on;`, added in
    # nginx 1.25.1) -- kept for compatibility with older LTS nginx still
    # common on Ubuntu 24.04 (ships 1.24.0), where `http2 on;` is an unknown
    # directive and fails config validation outright.
    listen 8445 ssl http2;
    listen [::]:8445 ssl http2;

    # PLACEHOLDER: same public hostname the existing :8444 admin/API block
    # already uses on this host (e.g. panel.example.com /
    # api.example.com for the real deployment -- substitute whichever
    # of those, or a dedicated one, the operator actually points DNS for
    # :8445 at). Left as settings.py's own placeholder default so this file
    # is never silently "correct-looking" with a fake real domain baked in.
    #
    # The second name is the Cloudflare-proxied backup route
    # (NEBULA_CDN_HOST; see services/api/src/nebula_api/cdn.py), for clients
    # that cannot reach this server's own address. Cloudflare reaches this
    # port through an Origin Rule, since :8445 is not one it proxies itself.
    server_name vpn.example.com cdn.example.com;

    # Behind Cloudflare the socket peer is a Cloudflare edge, which would
    # merge every user into one network for the API's per-network limits.
    # This restores the client's own address -- and only on connections that
    # really come from Cloudflare's ranges. See cloudflare-real-ip.conf.
    include /etc/nginx/snippets/cloudflare-real-ip.conf;

    # PLACEHOLDER: this repo does not know the real host's certificate
    # path. The existing :8444 nginx config is
    # manual/host-specific and untracked, so its cert path can't be read
    # from anywhere in-repo either. Point these at whatever the :8444
    # block already uses (same cert is fine if it covers this
    # server_name -- e.g. a wildcard or SAN cert already issued for the
    # domain) -- do not request a fresh cert for this alone unless the
    # existing one doesn't cover this name.
    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;

    # Added from the production-readiness audit (docs/runbooks/
    # production-readiness-audit.md, H-4): this port carries the
    # control-plane API as well as the tunnel, and had neither HSTS nor
    # clickjacking protection. `always` so nginx sends these on every
    # response this block produces, including its own error pages -- without
    # it a 4xx/5xx generated by nginx itself (not proxied from a backend)
    # skips add_header entirely.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # Every request through here is either tunnel data or an authenticated
    # API call -- neither belongs in a file that rotates on a two-week
    # schedule with the caller's IP attached. docs/threat-model.md commits to
    # logs never becoming a traffic-surveillance dataset; a per-request
    # access line naming who requested which page at what time is exactly
    # that, whether or not the payload itself is opaque. nginx's error log
    # (connection failures, TLS handshake errors) is unaffected -- that one
    # stays on, at the host's default level, because it holds nothing about
    # what a specific user did.
    access_log off;

    # Xray's XHTTP transport (formerly "SplitHTTP") is plain HTTP request/
    # response streaming, NOT a WebSocket-style Upgrade handshake -- it
    # runs over ordinary HTTP/1.1 or HTTP/2 POST/GET with chunked/streamed
    # bodies. Deliberately no `Upgrade`/`Connection: upgrade` headers here:
    # those belong to Xray's separate `ws` transport, and adding them to an
    # XHTTP proxy block doesn't clamp onto anything Xray or nginx expects
    # (Xray's XHTTP inbound performs no protocol upgrade negotiation) --
    # cargo-culting them in was avoided on purpose.
    location /xhttp {
        proxy_pass http://127.0.0.1:8446;

        # 1.1 (not the default 1.0) is required for chunked
        # transfer-encoding and connection reuse to the upstream; without
        # it nginx would buffer/rewrite the streamed body and could close
        # the upstream connection between chunks.
        proxy_http_version 1.1;

        # Let the upstream connection stay open/reusable rather than nginx
        # forcing `Connection: close` (its default when proxy_pass'ing a
        # 1.0-style request) -- XHTTP's "stream-up"/"stream-one" modes rely
        # on a long-lived request body and a long-lived response stream on
        # the same or paired connections.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Both directions must go unbuffered: XHTTP's download stream is a
        # long-lived response nginx must not hold in a buffer waiting for
        # it to finish (it never "finishes" until the client disconnects),
        # and its upload stream (stream-up/packet-up modes) is a
        # potentially large/long-lived request body nginx must not spool
        # to a temp file before forwarding -- either would silently break
        # streaming rather than error visibly.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        # No cap on request body size -- XHTTP's uploads are not a normal
        # bounded form/file POST, and nginx's 1m default would truncate a
        # tunnel session outright.
        client_max_body_size 0;

        # nginx's defaults (60s) are written for ordinary request/response
        # HTTP and will silently sever an idle-but-still-open XHTTP stream
        # (e.g. a tunnel with a lull in traffic) well before the client or
        # Xray consider it dead. Generous but not infinite -- Xray/the
        # client are expected to keep the stream active on their own
        # cadence; if real-world testing on the VPS shows this still cuts
        # long-idle sessions, raise it further rather than removing the
        # cap.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 0-RTT/early-data passthrough is optional and only meaningful if
        # TLS 1.3 early data is enabled above (it isn't, by default, in
        # this file) -- left out rather than set to a variable that would
        # be empty/misleading either way.
    }

    # The control-plane API (normally :8444, see the untracked host config)
    # is proxied here too, under /v1/ -- not for XHTTP's sake, just an
    # ordinary reverse proxy to the same API container. This exists because
    # a client whose ISP blocks :8444 outright (the exact problem that
    # motivated this whole Xray milestone) can't log in or request an Xray
    # client in the first place if the control-plane API isn't *also*
    # reachable through a port/transport that looks like ordinary HTTPS --
    # the tunnel alone doesn't help if the app can never get far enough to
    # bring it up. Deliberately a distinct path from /xhttp so the two never
    # collide, and mirrors the existing :8444 api.example.com block's
    # proxy_pass/headers exactly (see the untracked host nginx config).
    location /v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;

        # Uncomment once the matching `limit_req_zone` exists in nginx.conf's
        # http{} block -- see README.md, "Rate limiting the control-plane
        # path". This is a second, coarse layer in front of the API's own
        # per-account/per-network Redis limits: it costs nginx a shared-memory
        # lookup instead of a request reaching the application at all, which
        # matters against a flood aimed at exhausting connections rather than
        # credentials.
        # limit_req zone=nebula_api burst=20 nodelay;
    }

    # WebSocket and gRPC for the CDN route. On the direct route clients dial
    # these inbounds' own ports (8448, 8447); Cloudflare only reaches this
    # one, so it is routed here by path to the same inbounds -- the same
    # credentials work either way. Both inbounds terminate TLS themselves,
    # hence https/grpcs to loopback and the name their certificate carries.
    location /ws {
        proxy_pass https://127.0.0.1:8448;
        proxy_ssl_server_name on;
        proxy_ssl_name vpn.example.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Xray's gRPC paths are /<serviceName>/Tun and /<serviceName>/TunMulti.
    location /grpc/ {
        grpc_pass grpcs://127.0.0.1:8447;
        grpc_ssl_server_name on;
        grpc_ssl_name vpn.example.com;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
        client_body_timeout 600s;
        client_max_body_size 0;
    }

    # Certificate issuance for the CDN name. Its HTTP-01 check arrives
    # through Cloudflare, which may upgrade it to HTTPS and so land here
    # rather than on :80.
    location /.well-known/acme-challenge/ {
        root /var/www/nebula-acme;
    }

    # Anything outside the configured XHTTP/API paths is not this service's
    # concern -- and returning a generic 404 (rather than proxying `/`
    # wholesale) keeps this port from looking any different, to a casual
    # prober, than a default nginx vhost with nothing interesting on it.
    location / {
        return 404;
    }
}
