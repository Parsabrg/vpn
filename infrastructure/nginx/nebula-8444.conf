# The admin panel and the control-plane API on :8444, and plain HTTP on :80
# for certificate renewal only. Copied from the live deployment, where it was
# written by hand and never tracked (2026-10-26); a new installation had no
# way to serve its panel at all.
#
# Install as a site, replacing the three example names with your own:
#
#   sed -e 's/panel.example.com/panel.your.domain/g' \
#       -e 's/api.example.com/api.your.domain/g' \
#       -e 's/vpn.example.com/your.domain/g' \
#       infrastructure/nginx/nebula-8444.conf > /etc/nginx/sites-available/nebula
#   ln -s /etc/nginx/sites-available/nebula /etc/nginx/sites-enabled/nebula
#   cp infrastructure/nginx/nebula-ratelimit.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# The certificate is the one certbot issues for all three names; see
# docs/runbooks/install.md.

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com api.example.com vpn.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/nebula-acme;
    }
}

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # No limit_req: a cold page load asks for dozens of chunks at once, and a
    # 20r/s cap would answer the panel's own assets with 503s.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    client_max_body_size 2m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keyed on the peer nginx sees, never X-Forwarded-For. The zone is in
        # nebula-ratelimit.conf. burst=20 absorbs the app's opening flurry.
        limit_req zone=nebula_api burst=20 nodelay;
    }
}
