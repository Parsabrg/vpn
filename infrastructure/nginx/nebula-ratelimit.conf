# Rate-limit zone for the control-plane API (production-readiness audit M-2),
# used by nebula-8444.conf and xray-8445.conf. limit_req_zone is only valid in
# http{}, which /etc/nginx/conf.d/ is included into, so install it there:
#
#   cp infrastructure/nginx/nebula-ratelimit.conf /etc/nginx/conf.d/
#
# Keyed on the address nginx sees, never X-Forwarded-For, which the client
# supplies. 20r/s is generous for a real client and cheap to enforce.
limit_req_zone $binary_remote_addr zone=nebula_api:10m rate=20r/s;
