name: Python

on:
  pull_request:
    paths:
      [
        "services/api/**",
        "services/vpn-agent/**",
        "services/worker/**",
        "infrastructure/postgres/**",
        ".github/workflows/python.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "services/api/**",
        "services/vpn-agent/**",
        "services/worker/**",
        "infrastructure/postgres/**",
        ".github/workflows/python.yml",
      ]

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container: python:3.14.6-slim-trixie
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_DB: nebula
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
        options: >-
          --health-cmd "pg_isready -U postgres -d nebula"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.0
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DB: nebula
      POSTGRES_ADMIN_URL: postgresql://postgres:ci-postgres-only@postgres:5432/nebula
      NEBULA_DB_APP_USER: nebula_app
      NEBULA_DB_APP_PASSWORD: ci-app-only
      NEBULA_DB_MIGRATOR_USER: nebula_migrator
      NEBULA_DB_MIGRATOR_PASSWORD: ci-migrator-only
      NEBULA_DATABASE_URL: postgresql+psycopg://nebula_app:ci-app-only@postgres:5432/nebula
      MIGRATION_DATABASE_URL: postgresql+psycopg://nebula_migrator:ci-migrator-only@postgres:5432/nebula
      NEBULA_REDIS_URL: redis://redis:6379/0
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install workspaces
        run: >-
          python -m pip install
          -e './services/api[dev]' -e './services/vpn-agent[dev]' -e './services/worker[dev]'
      - name: Create least-privilege database roles
        run: python infrastructure/postgres/bootstrap_ci_roles.py
      - name: Upgrade database from empty to head
        working-directory: services/api
        run: python -m alembic upgrade head
      - name: Verify migration metadata is current
        working-directory: services/api
        run: python -m alembic check
      - name: Audit Python dependency graph
        run: python -m pip_audit
      - name: Ruff lint
        run: python -m ruff check services/api services/vpn-agent services/worker
      - name: Ruff format
        run: python -m ruff format --check services/api services/vpn-agent services/worker
      - name: Type check API
        working-directory: services/api
        run: python -m mypy
      - name: Type check VPN agent
        working-directory: services/vpn-agent
        run: python -m mypy
      - name: Type check worker
        working-directory: services/worker
        run: python -m mypy
      - name: Test API
        working-directory: services/api
        run: python -m pytest
      - name: Test VPN agent
        working-directory: services/vpn-agent
        run: python -m pytest
      - name: Test worker
        working-directory: services/worker
        run: python -m pytest

  netns-integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install WireGuard userspace tools
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools
      - name: Install VPN agent
        # ubuntu-latest's system Python is externally managed (PEP 668); a
        # venv is required here since this job (unlike `checks`) doesn't run
        # inside the python:3.14.6 container image.
        run: |
          python3 -m venv services/vpn-agent/.venv
          services/vpn-agent/.venv/bin/pip install -e './services/vpn-agent[dev]'
      - name: Provision an isolated netns WireGuard interface
        id: netns
        run: |
          set -eu
          ns="nebula-ci-$$"

          if ! sudo ip netns add "$ns" 2>/tmp/netns-add.log; then
            echo "::warning::could not create a network namespace ($(cat /tmp/netns-add.log)); skipping real WireGuard integration tests"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! sudo ip netns exec "$ns" ip link add wg0 type wireguard 2>/tmp/wg-add.log; then
            echo "::warning::this runner's kernel does not support WireGuard interfaces ($(cat /tmp/wg-add.log)); skipping real WireGuard integration tests"
            sudo ip netns del "$ns" || true
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sudo ip netns exec "$ns" ip link set lo up
          sudo ip netns exec "$ns" ip address add 10.77.0.1/24 dev wg0
          sudo ip netns exec "$ns" ip link set wg0 up

          key_dir=$(mktemp -d)
          umask 077
          wg genkey > "$key_dir/server_private_key"
          sudo ip netns exec "$ns" wg set wg0 listen-port 51820 private-key "$key_dir/server_private_key"
          sudo chmod 0644 "$key_dir/server_private_key"

          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "namespace=$ns" >> "$GITHUB_OUTPUT"
          echo "key_file=$key_dir/server_private_key" >> "$GITHUB_OUTPUT"
      - name: Real WireGuard netns integration tests
        if: steps.netns.outputs.available == 'true'
        working-directory: services/vpn-agent
        env:
          NEBULA_WG_NETNS_INTEGRATION: "1"
          NEBULA_ENV: test
          NEBULA_WG_DRIVER: native
          NEBULA_WG_INTERFACE: wg0
          NEBULA_WG_SERVER_ADDRESS: 10.77.0.1/24
          NEBULA_WG_CLIENT_POOL: 10.77.0.0/24
          NEBULA_WG_SERVER_PRIVATE_KEY_FILE: ${{ steps.netns.outputs.key_file }}
        run: >-
          sudo --preserve-env
          ip netns exec ${{ steps.netns.outputs.namespace }}
          "${{ github.workspace }}/services/vpn-agent/.venv/bin/python3" -m pytest
          tests/integration -m netns_integration --no-cov
      - name: Tear down the namespace
        if: always() && steps.netns.outputs.namespace != ''
        run: sudo ip netns del "${{ steps.netns.outputs.namespace }}" || true
